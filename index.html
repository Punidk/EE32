<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รวมข้อสอบ BY EE#32</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style -->
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <!-- Abstract Background -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <!-- Header -->
        <header class="hero-section fade-in">
            <div class="profile-pic">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="title">รวมข้อสอบ <span>BY EE#32</span></h1>
            <p class="subtitle">ศูนย์สะสมข้อสอบและแบบทดสอบสำหรับทบทวนบทเรียน</p>
        </header>

        <!-- Search Bar -->
        <div class="search-container fade-in" style="animation-delay: 0.2s;">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="search-input" placeholder="ค้นหาวิชาหรือข้อสอบ...">
        </div>

        <!-- Categories Container -->
        <main id="categories-container" class="categories-container">
            <!-- Sections Will Be Injected By app.js -->
        </main>

        <footer>
            <p>&copy; 2026 รวมข้อสอบ BY 32 | Built for excellence</p>
        </footer>
    </div>

    <!-- AI Chatbot FAB & Window -->
    <div class="ai-fab" id="ai-fab" title="ถามผู้ช่วย AI">
        <i class="fa-solid fa-robot"></i>
    </div>

    <div class="ai-chat-window" id="ai-chat-window">
        <div class="ai-header">
            <span><i class="fa-solid fa-bolt"></i> ผู้ช่วย EE#32 AI</span>
            <i class="fa-solid fa-xmark ai-close" id="ai-close"></i>
        </div>
        <div class="ai-messages" id="ai-messages">
            <div class="ai-message bot">สวัสดีครับ! มีอะไรให้ผมช่วยอธิบายเรื่องวิศวกรรมไฟฟ้า หรือข้อสอบต่างๆ ไหมครับ? พิมพ์ถามมาได้เลยครับ ⚡</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="ai-input" placeholder="พิมพ์คำถามของคุณที่นี่..." autocomplete="off">
            <button id="ai-send" title="ส่ง"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>

</html>
